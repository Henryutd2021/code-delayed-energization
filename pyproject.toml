[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code-delay"
version = "1.0.2"
description = "Cost of Delayed Grid Energization (CoDE) for AI data centers: private, ratepayer and social accounting of delayed grid service (framework of Li & She, NAPS 2026)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2"]
keywords = ["data centers", "grid interconnection", "large loads", "tariff design", "techno-economic analysis"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
code-delay = "code_delay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
